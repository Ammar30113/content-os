name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, logic tests, and production build
        run: npm run verify
        env:
          # Build-time placeholders. NEXT_PUBLIC_* values are inlined by `next
          # build`; the URL must match the pinned Content OS project so the
          # Supabase safety check passes. No real secrets are needed to build.
          NEXT_PUBLIC_SUPABASE_URL: https://rxcxgnmnwonqzizjrgoh.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
